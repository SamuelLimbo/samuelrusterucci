<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="Styling/main.css">
    <link rel="stylesheet" href="Styling/propermotion.css">

</head>

<body>
    <h1>The proper motion of the Andromeda Galaxy</h1>
    <nav class="navbar">
        <ul>
            <li> <a href="index.html"> Home </a> </li>
            <!-- target="_blank" after the a, this allows to open the link in a new page-->
            <li> <a href="research.html"> Research </a> </li>
            <li> <a href="contact.html"> Contact </a> </li>
        </ul>
    </nav>

    <p> </p>
    <div class="content">
        <lii> <a href="https://arxiv.org/abs/2410.18180" target="_blank"> &#x2015; Access the full paper &#x2015; </a>
        </lii>
        <p class="justified_text"> </p>

        <p class="title"> Abstract </p>

        <p class="title">Calculator</p>

        <label for="phot_config">Choose an option:</label>

        <div class="photometric-selector">

            <button type="button" class="phot-option" data-value="gr">
                gr
            </button>

            <button type="button" class="phot-option" data-value="ri">
                ri
            </button>

            <button type="button" class="phot-option" data-value="gri">
                gri
            </button>

            <button type="button" class="phot-option" data-value="ug">
                ug
            </button>

            <button type="button" class="phot-option" data-value="ugr">
                ugr
            </button>

            <button type="button" class="phot-option" data-value="ugri">
                ugri
            </button>

        </div>

        <!-- <div class="photometric-image">
            <img id="filterImage" src="Images/andromeda.jpeg" alt="Photometric configuration">
        </div> -->

        <div id="filterPlot"></div>

        <input type="hidden" id="phot_config">

        <p>
            Enter a value below:
        </p>

        <input type="number" id="distance" placeholder="Enter a distance">
        <input type="number" id="M_V" placeholder="Enter a M_V">
        <input type="number" id="r_h" placeholder="Enter a r_h">

        <button onclick="calculate()">Calculate</button>

        <script src="https://cdn.plot.ly/plotly-3.7.0.min.js"></script>
        <script src="JavaScript/plot_transmission.js"></script>

        <p id="output"></p>

    </div>
    <div class="bottom-shape"></div>
    <div class="rectangle"></div>

    <script>
        function calculate() {

            // Get the value entered by the user
            const phot_config = document.getElementById("phot_config").value;

            const distance = Number(document.getElementById("distance").value);
            const M_V = Number(document.getElementById("M_V").value);
            const r_h = Number(document.getElementById("r_h").value);

            let result;

            if (distance < 10 || distance > 1000 || M_V < -8 || M_V > 2 || r_h < 1 || r_h > 1000) {
                document.getElementById("output").textContent =
                    "Please enter a value within the boundaries of the study";
            }

            else if (phot_config === "gr") {
                if (distance > 10 && distance < 21.5) {
                    result = distance * 2;
                }
            }

            // Display the result
            document.getElementById("output").textContent =
                "Result: " + result.toFixed(2);
        }
    </script>

</body>

</html>
